services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: biblioteca-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BibliotecaDemo_2026"
    ports:
      - "1433:1433"
    volumes:
      - biblioteca-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P BibliotecaDemo_2026 -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: biblioteca-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./01-crear-base.sql:/scripts/Script-DB.sql:ro
    command: /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P BibliotecaDemo_2026 -C -b -i /scripts/Script-DB.sql
volumes:
  biblioteca-data:
